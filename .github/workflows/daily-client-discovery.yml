name: Daily Client Discovery

on:
  schedule:
    # 08:30 UTC (09:30 Portugal winter / 10:30 summer)
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: pip install -r client_hunter_requirements.txt

      - name: Find and verify public business prospects
        env:
          MAX_LEADS: "8"
        run: python client_hunter.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f out/prospects.md ]; then
            cat out/prospects.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Client discovery did not produce a Markdown report. Check job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload prospect reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fahim-client-prospects-${{ github.run_number }}
          path: |
            out/prospects.md
            out/prospects.csv
            out/prospects.json
          if-no-files-found: error
          retention-days: 30
