name: API Lab syntax check

on:
  push:
    branches: [free-api-lab]
    paths:
      - "api-lab/**"
      - ".github/workflows/api-lab-check.yml"
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Streamlit app
        run: python -m py_compile api-lab/app.py
